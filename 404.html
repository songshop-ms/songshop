<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>페이지를 찾을 수 없습니다 - SONGSHOP 송샵</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #8E7C68;
            --bg-color: #FDFBF9;
            --text-main: #2C2C2C;
            --text-sub: #555555;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            line-height: 1.7;
        }
        .code {
            font-family: 'Gowun Batang', serif;
            font-size: 4rem;
            color: var(--primary-color);
            letter-spacing: -0.03em;
        }
        h1 {
            font-family: 'Gowun Batang', serif;
            font-size: 1.4rem;
            margin: 16px 0 8px;
            letter-spacing: -0.03em;
        }
        p { color: var(--text-sub); font-size: 0.95rem; }
        .links { margin-top: 32px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        a {
            display: inline-block;
            padding: 12px 24px;
            border: 1px solid var(--primary-color);
            border-radius: 999px;
            color: var(--primary-color);
            text-decoration: none;
            font-size: 0.9rem;
            transition: background 0.2s, color 0.2s;
        }
        a:hover { background: var(--primary-color); color: #fff; }
        .brand { margin-top: 40px; font-size: 0.8rem; color: #aaa; letter-spacing: 0.1em; }
    </style>
</head>
<body>
    <main>
        <div class="code">404</div>
        <h1>페이지를 찾을 수 없습니다</h1>
        <p>주소가 바뀌었거나 삭제된 페이지입니다.</p>
        <div class="links">
            <a href="https://www.songshopbysong.com/">홈으로</a>
            <a href="https://pf.kakao.com/_xhKxnhxj/chat">카카오톡 상담</a>
        </div>
        <div class="brand">SONGSHOP</div>
    </main>
</body>
</html>
