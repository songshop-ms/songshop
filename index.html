<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SONGSHOP 상담용 눈썹 디자이너</title>
    
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #8E7C68;
            --primary-dark: #6D5E4D;
            --bg-color: #FDFBF9;
            --gold: #C9A96E;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Pretendard', sans-serif;
            background: var(--bg-color);
            color: #2C2C2C;
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 80px;
        }

        .container { max-width: 500px; margin: 0 auto; padding: 0 20px; }
        .header { text-align: center; padding: 30px 0 15px; }
        .header h1 { font-family: 'Gowun Batang', serif; font-size: 1.5rem; font-weight: 700; margin-bottom: 6px; }
        .header p { font-size: 0.85rem; color: #555; }

        /* 캔버스 영역 */
        .canvas-container {
            position: relative;
            width: 100%;
            aspect-ratio: 3/4;
            background: #e8e3de;
            border-radius: 16px;
            overflow: hidden;
            margin: 15px 0;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            touch-action: none;
        }
        .canvas-container canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        .placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #aaa;
            font-size: 0.9rem;
            text-align: center;
            gap: 10px;
            pointer-events: none;
        }
        .placeholder i { font-size: 2.5rem; color: #ccc; }

        /* 버튼 */
        .btn-group {
            display: flex;
            gap: 10px;
            margin: 10px 0;
            flex-wrap: wrap;
        }
        .btn {
            flex: 1;
            min-width: 100px;
            padding: 14px 10px;
            border: none;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: 'Pretendard', sans-serif;
        }
        .btn:active { transform: scale(0.96); }
        .btn-upload { background: #1a1a1a; color: white; }
        .btn-reset { background: #f5f0eb; color: #666; }

        /* 프리셋 */
        .preset-section {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            gap: 8px;
            padding: 10px 0 15px;
            -webkit-overflow-scrolling: touch;
        }
        .preset-section::-webkit-scrollbar { display: none; }
        .preset-btn {
            flex: 0 0 auto;
            padding: 10px 14px;
            border-radius: 20px;
            background: white;
            border: 1px solid #E5E0DA;
            font-size: 0.8rem;
            font-weight: 600;
            color: #555;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            font-family: 'Pretendard', sans-serif;
        }
        .preset-btn.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
        }
        .preset-btn:active { transform: scale(0.95); }

        /* 변환 제어 패널 */
        .transform-panel {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin: 10px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #f0edE9;
        }
        .panel-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--primary-color);
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .control-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .control-label {
            font-size: 0.75rem;
            color: #888;
            min-width: 50px;
            text-align: right;
        }
        input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            height: 4px;
            border-radius: 2px;
            background: #E5E0DA;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: pointer;
        }
        .value-label {
            font-size: 0.75rem;
            color: #555;
            min-width: 40px;
            text-align: center;
        }

        /* 캡처 안내 */
        .capture-guide {
            font-size: 0.85rem;
            color: #B8955A;
            margin-top: 15px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .footer { text-align: center; padding: 30px 0 10px; color: #aaa; font-size: 0.75rem; }
    </style>
</head>
<body>

    <div class="header">
        <h1>👁️‍🗨️ 상담용 눈썹 디자이너</h1>
        <p>사진을 올리고 눈썹 프리셋을 선택한 뒤,<br>점을 움직여 딱 맞게 조절하세요</p>
    </div>

    <div class="container">
        <!-- 캔버스 -->
        <div class="canvas-container" id="canvasContainer">
            <canvas id="mainCanvas"></canvas>
            <div class="placeholder" id="placeholder">
                <i class="fas fa-camera"></i>
                <p>사진을 업로드해주세요</p>
            </div>
        </div>

        <!-- 업로드 버튼 -->
        <div class="btn-group">
            <button class="btn btn-upload" id="uploadBtn"><i class="fas fa-image"></i> 사진 업로드</button>
            <button class="btn btn-reset" id="resetBtn"><i class="fas fa-redo"></i> 초기화</button>
        </div>
        <input type="file" id="fileInput" accept="image/*" style="display:none;">

        <!-- 눈썹 프리셋 -->
        <div class="preset-section" id="presetSection">
            <button class="preset-btn active" data-preset="natural">내추럴 아치</button>
            <button class="preset-btn" data-preset="chic">시크 스트레이트</button>
            <button class="preset-btn" data-preset="innocent">청순 소프트</button>
            <button class="preset-btn" data-preset="urban">도회적 표준</button>
            <button class="preset-btn" data-preset="cover">잔흔 커버</button>
        </div>

        <!-- 사진 변환 패널 -->
        <div class="transform-panel">
            <div class="panel-title"><i class="fas fa-image"></i> 사진 조절</div>
            <div class="control-row">
                <span class="control-label">확대</span>
                <input type="range" id="photoZoom" min="0.5" max="3" step="0.01" value="1">
                <span class="value-label" id="photoZoomVal">100%</span>
            </div>
            <div class="control-row">
                <span class="control-label">이동</span>
                <input type="range" id="photoPanX" min="-200" max="200" step="1" value="0">
                <span class="value-label" id="photoPanXVal">0</span>
            </div>
            <div class="control-row">
                <span class="control-label">이동</span>
                <input type="range" id="photoPanY" min="-200" max="200" step="1" value="0">
                <span class="value-label" id="photoPanYVal">0</span>
            </div>
            <div class="control-row">
                <span class="control-label">회전</span>
                <input type="range" id="photoRotate" min="-30" max="30" step="0.5" value="0">
                <span class="value-label" id="photoRotateVal">0°</span>
            </div>
        </div>

        <!-- 눈썹 변환 패널 -->
        <div class="transform-panel">
            <div class="panel-title"><i class="fas fa-paint-brush"></i> 눈썹 조절</div>
            <div class="control-row">
                <span class="control-label">확대</span>
                <input type="range" id="browZoom" min="0.5" max="3" step="0.01" value="1">
                <span class="value-label" id="browZoomVal">100%</span>
            </div>
            <div class="control-row">
                <span class="control-label">이동</span>
                <input type="range" id="browPanX" min="-200" max="200" step="1" value="0">
                <span class="value-label" id="browPanXVal">0</span>
            </div>
            <div class="control-row">
                <span class="control-label">이동</span>
                <input type="range" id="browPanY" min="-200" max="200" step="1" value="0">
                <span class="value-label" id="browPanYVal">0</span>
            </div>
            <div class="control-row">
                <span class="control-label">회전</span>
                <input type="range" id="browRotate" min="-30" max="30" step="0.5" value="0">
                <span class="value-label" id="browRotateVal">0°</span>
            </div>
        </div>

        <div class="capture-guide">
            <i class="fas fa-camera"></i> 조절이 끝나면 화면을 캡처해서 고객에게 보내주세요
        </div>
    </div>

    <div class="footer">
        <p>&copy; 2025 SONGSHOP. All rights reserved.</p>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const canvasContainer = document.getElementById('canvasContainer');
        const placeholder = document.getElementById('placeholder');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const resetBtn = document.getElementById('resetBtn');

        let uploadedImage = null; // 업로드된 이미지
        let currentPreset = 'natural';
        let leftBrowPoints = []; // 왼쪽 눈썹 제어점 (5개)
        let rightBrowPoints = []; // 오른쪽 눈썹 제어점 (5개)

        // 사진 변환 상태
        let photoTransform = { zoom: 1, panX: 0, panY: 0, rotate: 0 };
        // 눈썹 변환 상태
        let browTransform = { zoom: 1, panX: 0, panY: 0, rotate: 0 };

        // 드래그 상태
        let draggingPoint = null;
        let dragOffset = { x: 0, y: 0 };

        // 프리셋 정의 (기본 눈썹 모양 비율 - 캔버스 기준)
        // 각 포인트: [x비율, y비율] (캔버스 중앙 기준)
        const eyebrowPresets = {
            natural: {
                label: '내추럴 아치',
                leftPoints: [
                    [0.25, 0.45], [0.32, 0.40], [0.40, 0.36], [0.48, 0.40], [0.55, 0.45]
                ],
                rightPoints: [
                    [0.75, 0.45], [0.68, 0.40], [0.60, 0.36], [0.52, 0.40], [0.45, 0.45]
                ]
            },
            chic: {
                label: '시크 스트레이트',
                leftPoints: [
                    [0.25, 0.42], [0.32, 0.41], [0.40, 0.40], [0.48, 0.41], [0.55, 0.42]
                ],
                rightPoints: [
                    [0.75, 0.42], [0.68, 0.41], [0.60, 0.40], [0.52, 0.41], [0.45, 0.42]
                ]
            },
            innocent: {
                label: '청순 소프트',
                leftPoints: [
                    [0.25, 0.46], [0.32, 0.39], [0.40, 0.34], [0.48, 0.39], [0.55, 0.46]
                ],
                rightPoints: [
                    [0.75, 0.46], [0.68, 0.39], [0.60, 0.34], [0.52, 0.39], [0.45, 0.46]
                ]
            },
            urban: {
                label: '도회적 표준',
                leftPoints: [
                    [0.25, 0.44], [0.32, 0.40], [0.40, 0.37], [0.48, 0.40], [0.55, 0.44]
                ],
                rightPoints: [
                    [0.75, 0.44], [0.68, 0.40], [0.60, 0.37], [0.52, 0.40], [0.45, 0.44]
                ]
            },
            cover: {
                label: '잔흔 커버',
                leftPoints: [
                    [0.25, 0.43], [0.32, 0.40], [0.40, 0.38], [0.48, 0.40], [0.55, 0.43]
                ],
                rightPoints: [
                    [0.75, 0.43], [0.68, 0.40], [0.60, 0.38], [0.52, 0.40], [0.45, 0.43]
                ]
            }
        };

        // 캔버스 크기 설정
        function resizeCanvas() {
            const rect = canvasContainer.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            if (uploadedImage) {
                drawCanvas();
            }
        }

        // 프리셋 적용
        function applyPreset(presetName) {
            const preset = eyebrowPresets[presetName];
            if (!preset) return;

            leftBrowPoints = preset.leftPoints.map(([xRatio, yRatio]) => ({
                x: xRatio * canvas.width,
                y: yRatio * canvas.height
            }));
            rightBrowPoints = preset.rightPoints.map(([xRatio, yRatio]) => ({
                x: xRatio * canvas.width,
                y: yRatio * canvas.height
            }));

            currentPreset = presetName;
            updatePresetButtons();
            drawCanvas();
        }

        function updatePresetButtons() {
            document.querySelectorAll('.preset-btn[data-preset]').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.preset === currentPreset);
            });
        }

        // 캔버스 그리기
        function drawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. 사진 그리기 (사진 변환 적용)
            if (uploadedImage) {
                ctx.save();
                ctx.translate(canvas.width / 2 + photoTransform.panX, canvas.height / 2 + photoTransform.panY);
                ctx.rotate(photoTransform.rotate * Math.PI / 180);
                ctx.scale(photoTransform.zoom, photoTransform.zoom);
                const imgWidth = canvas.width * 0.9;
                const imgHeight = canvas.height * 0.9;
                ctx.drawImage(uploadedImage, -imgWidth / 2, -imgHeight / 2, imgWidth, imgHeight);
                ctx.restore();
            }

            // 2. 눈썹 그리기 (눈썹 변환 적용)
            if (leftBrowPoints.length > 0 && rightBrowPoints.length > 0) {
                ctx.save();
                ctx.translate(canvas.width / 2 + browTransform.panX, canvas.height / 2 + browTransform.panY);
                ctx.rotate(browTransform.rotate * Math.PI / 180);
                ctx.scale(browTransform.zoom, browTransform.zoom);

                // 눈썹 점선
                drawBrowDashedLine(leftBrowPoints);
                drawBrowDashedLine(rightBrowPoints);

                // 제어점
                drawControlPoints(leftBrowPoints);
                drawControlPoints(rightBrowPoints);

                ctx.restore();
            }

            // 3. 플레이스홀더 숨김/표시
            if (uploadedImage) {
                placeholder.style.display = 'none';
            } else {
                placeholder.style.display = 'flex';
            }
        }

        function drawBrowDashedLine(points) {
            if (points.length < 3) return;
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 0; i < points.length - 1; i++) {
                const p0 = points[Math.max(0, i - 1)];
                const p1 = points[i];
                const p2 = points[i + 1];
                const p3 = points[Math.min(points.length - 1, i + 2)];
                for (let t = 0; t <= 1; t += 0.05) {
                    const t2 = t * t;
                    const t3 = t2 * t;
                    const x = 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3);
                    const y = 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3);
                    ctx.lineTo(x, y);
                }
            }
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.lineWidth = 2.5;
            ctx.setLineDash([5, 4]);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawControlPoints(points) {
            points.forEach(pt => {
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, draggingPoint ? 7 : 5, 0, Math.PI * 2);
                ctx.fillStyle = draggingPoint ? 'rgba(255, 255, 255, 0.9)' : 'rgba(201, 169, 110, 0.8)';
                ctx.fill();
                ctx.strokeStyle = '#8E7C68';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            });
        }

        // 좌표 변환 (눈썹 변환 기준)
        function getBrowLocalCoords(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const x = (clientX - rect.left) * (canvas.width / rect.width);
            const y = (clientY - rect.top) * (canvas.height / rect.height);

            // 눈썹 변환 역산
            const centerX = canvas.width / 2 + browTransform.panX;
            const centerY = canvas.height / 2 + browTransform.panY;
            const cos = Math.cos(-browTransform.rotate * Math.PI / 180);
            const sin = Math.sin(-browTransform.rotate * Math.PI / 180);
            const dx = x - centerX;
            const dy = y - centerY;
            const localX = (dx * cos - dy * sin) / browTransform.zoom;
            const localY = (dx * sin + dy * cos) / browTransform.zoom;
            return { x: localX, y: localY };
        }

        function findPointAt(pos) {
            const radius = 15;
            for (let i = 0; i < leftBrowPoints.length; i++) {
                if (Math.hypot(pos.x - leftBrowPoints[i].x, pos.y - leftBrowPoints[i].y) < radius) return { side: 'left', index: i };
                if (Math.hypot(pos.x - rightBrowPoints[i].x, pos.y - rightBrowPoints[i].y) < radius) return { side: 'right', index: i };
            }
            return null;
        }

        // 드래그 이벤트
        canvas.addEventListener('mousedown', (e) => {
            const pos = getBrowLocalCoords(e.clientX, e.clientY);
            const found = findPointAt(pos);
            if (found) {
                draggingPoint = found;
                const pt = found.side === 'left' ? leftBrowPoints[found.index] : rightBrowPoints[found.index];
                dragOffset = { x: pos.x - pt.x, y: pos.y - pt.y };
                e.preventDefault();
                drawCanvas();
            }
        });

        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1 && uploadedImage) {
                const pos = getBrowLocalCoords(e.touches[0].clientX, e.touches[0].clientY);
                const found = findPointAt(pos);
                if (found) {
                    draggingPoint = found;
                    const pt = found.side === 'left' ? leftBrowPoints[found.index] : rightBrowPoints[found.index];
                    dragOffset = { x: pos.x - pt.x, y: pos.y - pt.y };
                    e.preventDefault();
                    drawCanvas();
                }
            }
        }, { passive: false });

        window.addEventListener('mousemove', (e) => {
            if (draggingPoint) {
                const pos = getBrowLocalCoords(e.clientX, e.clientY);
                movePoint(draggingPoint.side, draggingPoint.index, pos.x - dragOffset.x, pos.y - dragOffset.y);
                e.preventDefault();
            }
        });

        canvas.addEventListener('touchmove', (e) => {
            if (draggingPoint && e.touches.length === 1) {
                const pos = getBrowLocalCoords(e.touches[0].clientX, e.touches[0].clientY);
                movePoint(draggingPoint.side, draggingPoint.index, pos.x - dragOffset.x, pos.y - dragOffset.y);
                e.preventDefault();
            }
        }, { passive: false });

        window.addEventListener('mouseup', () => {
            draggingPoint = null;
            drawCanvas();
        });
        canvas.addEventListener('touchend', () => {
            draggingPoint = null;
            drawCanvas();
        });

        function movePoint(side, index, x, y) {
            if (side === 'left') {
                leftBrowPoints[index].x = x;
                leftBrowPoints[index].y = y;
                // 대칭
                const centerX = canvas.width / 2;
                rightBrowPoints[index].x = centerX - (x - centerX);
                rightBrowPoints[index].y = y;
            } else {
                rightBrowPoints[index].x = x;
                rightBrowPoints[index].y = y;
                const centerX = canvas.width / 2;
                leftBrowPoints[index].x = centerX - (x - centerX);
                leftBrowPoints[index].y = y;
            }
            drawCanvas();
        }

        // 이미지 업로드
        uploadBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length === 0) return;
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    uploadedImage = img;
                    resizeCanvas();
                    // 눈썹 프리셋 초기화
                    applyPreset(currentPreset);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // 초기화
        resetBtn.addEventListener('click', () => {
            uploadedImage = null;
            leftBrowPoints = [];
            rightBrowPoints = [];
            photoTransform = { zoom: 1, panX: 0, panY: 0, rotate: 0 };
            browTransform = { zoom: 1, panX: 0, panY: 0, rotate: 0 };
            updateTransformUI();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            placeholder.style.display = 'flex';
        });

        // 변환 UI 업데이트
        function updateTransformUI() {
            document.getElementById('photoZoom').value = photoTransform.zoom;
            document.getElementById('photoZoomVal').textContent = Math.round(photoTransform.zoom * 100) + '%';
            document.getElementById('photoPanX').value = photoTransform.panX;
            document.getElementById('photoPanXVal').textContent = photoTransform.panX;
            document.getElementById('photoPanY').value = photoTransform.panY;
            document.getElementById('photoPanYVal').textContent = photoTransform.panY;
            document.getElementById('photoRotate').value = photoTransform.rotate;
            document.getElementById('photoRotateVal').textContent = photoTransform.rotate + '°';

            document.getElementById('browZoom').value = browTransform.zoom;
            document.getElementById('browZoomVal').textContent = Math.round(browTransform.zoom * 100) + '%';
            document.getElementById('browPanX').value = browTransform.panX;
            document.getElementById('browPanXVal').textContent = browTransform.panX;
            document.getElementById('browPanY').value = browTransform.panY;
            document.getElementById('browPanYVal').textContent = browTransform.panY;
            document.getElementById('browRotate').value = browTransform.rotate;
            document.getElementById('browRotateVal').textContent = browTransform.rotate + '°';
        }

        // 사진 변환 슬라이더 이벤트
        document.getElementById('photoZoom').addEventListener('input', (e) => {
            photoTransform.zoom = parseFloat(e.target.value);
            document.getElementById('photoZoomVal').textContent = Math.round(photoTransform.zoom * 100) + '%';
            drawCanvas();
        });
        document.getElementById('photoPanX').addEventListener('input', (e) => {
            photoTransform.panX = parseInt(e.target.value);
            document.getElementById('photoPanXVal').textContent = photoTransform.panX;
            drawCanvas();
        });
        document.getElementById('photoPanY').addEventListener('input', (e) => {
            photoTransform.panY = parseInt(e.target.value);
            document.getElementById('photoPanYVal').textContent = photoTransform.panY;
            drawCanvas();
        });
        document.getElementById('photoRotate').addEventListener('input', (e) => {
            photoTransform.rotate = parseFloat(e.target.value);
            document.getElementById('photoRotateVal').textContent = photoTransform.rotate + '°';
            drawCanvas();
        });

        // 눈썹 변환 슬라이더 이벤트
        document.getElementById('browZoom').addEventListener('input', (e) => {
            browTransform.zoom = parseFloat(e.target.value);
            document.getElementById('browZoomVal').textContent = Math.round(browTransform.zoom * 100) + '%';
            drawCanvas();
        });
        document.getElementById('browPanX').addEventListener('input', (e) => {
            browTransform.panX = parseInt(e.target.value);
            document.getElementById('browPanXVal').textContent = browTransform.panX;
            drawCanvas();
        });
        document.getElementById('browPanY').addEventListener('input', (e) => {
            browTransform.panY = parseInt(e.target.value);
            document.getElementById('browPanYVal').textContent = browTransform.panY;
            drawCanvas();
        });
        document.getElementById('browRotate').addEventListener('input', (e) => {
            browTransform.rotate = parseFloat(e.target.value);
            document.getElementById('browRotateVal').textContent = browTransform.rotate + '°';
            drawCanvas();
        });

        // 프리셋 버튼
        document.querySelectorAll('.preset-btn[data-preset]').forEach(btn => {
            btn.addEventListener('click', () => {
                applyPreset(btn.dataset.preset);
            });
        });

        // 창 크기 변경
        window.addEventListener('resize', resizeCanvas);

        // 초기화
        resizeCanvas();
        updateTransformUI();
        placeholder.style.display = 'flex';
    </script>
</body>
</html>
